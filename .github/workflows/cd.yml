name: CD - Entrega do site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Preparar entrega
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Montar pacote do site
        run: |
          mkdir -p dist/src
          cp index.html styles.css dist/
          cp src/*.js dist/src/

      - name: Publicar artefato da entrega
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publicar no GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: package
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Implantar site
        id: deployment
        uses: actions/deploy-pages@v4
